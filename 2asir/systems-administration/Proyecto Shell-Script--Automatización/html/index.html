<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apache en Docker - 2º ASIR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 700px;
            width: 100%;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.8s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        h1 {
            color: #764ba2;
            font-size: 2.5em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .subtitle {
            color: #667eea;
            font-size: 1.3em;
            margin-bottom: 30px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .info-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            border-radius: 12px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        
        .info-card h3 {
            color: #764ba2;
            margin-bottom: 8px;
            font-size: 1.1em;
        }
        
        .info-card p {
            color: #555;
            font-size: 0.95em;
        }
        
        .tech-stack {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .tech-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 500;
        }
        
        footer {
            margin-top: 40px;
            color: #666;
            font-size: 0.9em;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        
        .status {
            display: inline-block;
            background: #27ae60;
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.85em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🐳</div>
        <h1>¡Apache Funcionando!</h1>
        <p class="subtitle">Servidor containerizado con Docker</p>
        
        <span class="status">✅ Servicio Activo</span>
        
        <div class="info-grid">
            <div class="info-card">
                <h3>📦 Imagen Base</h3>
                <p>Ubuntu 22.04 LTS</p>
            </div>
            <div class="info-card">
                <h3>🌐 Servidor Web</h3>
                <p>Apache 2.4</p>
            </div>
            <div class="info-card">
                <h3>🔌 Puerto</h3>
                <p>80 (HTTP)</p>
            </div>
            <div class="info-card">
                <h3>💾 Persistencia</h3>
                <p>Docker Volume</p>
            </div>
        </div>
        
        <div class="tech-stack">
            <span class="tech-badge">Docker</span>
            <span class="tech-badge">Ansible</span>
            <span class="tech-badge">Bash</span>
            <span class="tech-badge">Git</span>
        </div>
        
        <footer>
            <p><strong>Práctica:</strong> Administración de Sistemas</p>
            <p><strong>Curso:</strong> 2º ASIR - Salesianos Atocha</p>
        </footer>
    </div>
</body>
</html>
