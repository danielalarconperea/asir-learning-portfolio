<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ejemplo del uso de formularios</title>
</head>
<body>
    <form action="/submit" method="post">
        <fieldset>
            <legend>Formulario Completo</legend>
    
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" value="Daniel"><br><br>
    
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" size="25" placeholder="escribetucorreo@example.com"><br><br>
    
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" min="1" max="100"><br><br>
    
            <label for="fecha-nacimiento">Fecha de Nacimiento:</label>
            <input type="date" id="fecha-nacimiento" name="fecha-nacimiento"><br><br>
    
            <label for="hora-reunion">Hora de la Reunión:</label>
            <input type="time" id="hora-reunion" name="hora-reunion"><br><br>
    
            <label for="mes">Selecciona el mes:</label>
            <input type="month" id="mes" name="mes"><br><br>
    
            <label for="semana">Selecciona la semana:</label>
            <input type="week" id="semana" name="semana"><br><br>
    
            <label for="color-favorito">Elige tu color favorito:</label>
            <input type="color" id="color-favorito" name="color-favorito" value="#ff0000"><br><br>
    
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" placeholder="+34 600 000 000"><br><br>
    
            <label for="archivo">Subir Archivo:</label>
            <input type="file" id="archivo" name="archivo"><br><br>
    
            <label for="intereses">Intereses:</label><br>
            <input type="checkbox" id="musica" name="intereses" value="musica">
            <label for="musica">Música</label><br>
            <input type="checkbox" id="deportes" name="intereses" value="deportes">
            <label for="deportes">Deportes</label><br><br>
    
            <label for="genero">Género:</label><br>
            <input type="radio" id="hombre" name="genero" value="hombre">
            <label for="hombre">Hombre</label><br>
            <input type="radio" id="mujer" name="genero" value="mujer">
            <label for="mujer">Mujer</label><br><br>
    
            <label for="pais">País:</label>
            <select id="pais" name="pais">
                <option value="es">España</option>
                <option value="mx">México</option>
                <option value="ar">Argentina</option>
                <option value="us">Estados Unidos</option>
                <option value="fr">Francia</option>
                <option value="de">Alemania</option>
                <option value="it">Italia</option>
                <option value="jp">Japón</option>
                <option value="cn">China</option>
                <option value="ca">Canadá</option>
                <option value="br">Brasil</option>
                <option value="au">Australia</option>
                <option value="in">India</option>
                <option value="uk">Reino Unido</option>
                <option value="pt">Portugal</option>
            </select><br><br>
    
            <label for="comentarios">Comentarios:</label><br>
            <textarea id="comentarios" name="comentarios" rows="4" cols="50" placeholder="comenta aquí tus comentarios"></textarea><br><br>

            <label for="volumen">Volumen:</label>
            <input type="range" id="volumen" name="volumen" min="0" max="100"><br><br>
    
            <input type="submit" value="Enviar">
            <input type="reset" value="Restablecer">
        </fieldset>
    </form>
    
</body>
</html>
