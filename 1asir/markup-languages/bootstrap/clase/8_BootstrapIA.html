<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Mi Sitio Web</title>
  <!-- Enlace al CSS de Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Opcional: Enlace a íconos de Bootstrap (para usar <i class="bi bi-...">) -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
  />
</head>
<body>
  <!-- Barra de navegación -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <!-- Nombre del sitio web (Navbar brand) -->
      <a class="navbar-brand" href="#">Mi Sitio Web</a>

      <!-- Botón que aparece en pantallas pequeñas para mostrar/ocultar el menú -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Enlaces del menú -->
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="#">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Acerca de</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Contacto</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenedor principal -->
  <div class="container my-5">
    <div class="row">
      <!-- Columna izquierda (imagen + párrafo) -->
      <div class="col-12 col-md-6">
        <img
          src="https://via.placeholder.com/400x500" 
          alt="Imagen de ejemplo"
          class="img-fluid mb-3"
        />
        <p>
          Este es un párrafo de ejemplo que describe la imagen de arriba.
          Aquí puedes añadir cualquier texto relevante para tu sitio web.
        </p>
      </div>

      <!-- Columna derecha (lista con iconos) -->
      <div class="col-12 col-md-6">
        <ul class="list-unstyled">
          <li class="mb-2">
            <i class="bi bi-check-circle-fill text-primary"></i>
            Primer elemento de la lista
          </li>
          <li class="mb-2">
            <i class="bi bi-star-fill text-warning"></i>
            Segundo elemento de la lista
          </li>
          <li class="mb-2">
            <i class="bi bi-heart-fill text-danger"></i>
            Tercer elemento de la lista
          </li>
        </ul>
      </div>
    </div>

    <!-- Botón centrado "Leer más" -->
    <div class="text-center mt-4">
      <button type="button" class="btn btn-primary">Leer más</button>
    </div>
  </div>

  <!-- Scripts de Bootstrap (JS + Popper) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
