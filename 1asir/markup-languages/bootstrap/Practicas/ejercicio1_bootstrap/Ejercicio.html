<!doctype html>
<html>
<head>
    <title>Ejemplos Bootstrap</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie-edge">

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <style type="text/css">

    </style>

</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="#">Mi Sitio Web</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="#">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Acerca de</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="row pt-4">
            <div class ="col-12 col-md-6">
                <img src="./luis.jpg" alt="">
                <p class="pt-3">
                    Este es un párrafo de ejemplo que describe la imagen de arriba.
                    Aquí puedes añadir cualquier texto relevante para tu sitio web.
                </p>
            </div>
            <div class ="col-12 col-md-6">
                <ul class="list-group">
                    <li class="list-group-item">
                        <i class="bi bi-check-lg"></i>
                        Primer elemento de la lista
                    </li>
                    <li class="list-group-item">
                        <i class="bi bi-star-fill"></i>
                        Segundo elemento de la lista
                    </li>
                    <li class="list-group-item">
                        <i class="bi bi-suit-heart-fill"></i>
                        Tercer elemento de la lista
                    </li>
                </ul>
            </div>
        </div>
        <div class="text-center mt-4">
            <button type="button" class="btn btn-primary">Leer más</button>
        </div>
    </div>
</body>

</html>

<!-- 
Crea una página web responsive utilizando Bootstrap que contenga los siguientes elementos:

Una barra de navegación en la parte superior con el nombre de tu sitio web y tres enlaces.

Un contenedor principal con dos columnas en dispositivos medianos y grandes, pero una sola columna en dispositivos pequeños.

En la columna izquierda, coloca una imagen y un párrafo de texto debajo.

En la columna derecha, crea una lista de 3 elementos con iconos.

Al final de la página, añade un botón centrado que diga "Leer más". -->
