<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<style>
table{
    border: rgb(0, 106, 255) 1px solid;
    border-collapse: separate; /* collapse */
    empty-cells: show; /* hide */
    border-spacing: 6px;
}
td,th{
    border: red 1px solid;
    padding: 15px;
}
caption{
    caption-side: bottom;
}
</style>
</head>
<body bgcolor=black>

<caption><font color=white><center>Casas en venta en salesianos atocha</center></font></caption>
<table border=1 bgcolor='#aaae00' width=90% align=center>
    <tr align=center>
        <th>País</th>
        <th>Foto</th>
        <th>Precio</th>
    </tr>
    <tr align=center>
        <td>España</td>
        <td></td>
        <td>6.000.000 euros</td>
    </tr>
    <tr align=center>
        <td>Francia</td>
        <td style="empty-cells: hide;"></td>
        <td>300.000 euros</td>
    </tr>
    <tr align=center>
        <td>Noruega</td>
        <td></td>
        <td>100.000 euros</td>
    </tr>
</table>

</body>
</html>
