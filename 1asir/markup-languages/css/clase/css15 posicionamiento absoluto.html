<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POSICIONAMIENTO ABSOLUTO</title>
<style>
    div{
        border: 2px solid black;
    }
    #exterior{
        background-color: red;
        height: 200px;
        width: 200px;
        margin: 20px;

    }
    .interior{
        background-color: blue;
        width: 100px;
        height: 100px;
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 2;
        opacity: 0.7;
    }
    .interior2{
        background-color: green;
        width: 100px;
        height: 100px;
        position: absolute;
        left: 40px;
        top: 40px;
        z-index: 4;
    }
</style>
</head>
<body>
    <div id="exterior">
        <div class="interior"></div>
        <div class="interior2"></div>
    </div>
</body>
</html>
