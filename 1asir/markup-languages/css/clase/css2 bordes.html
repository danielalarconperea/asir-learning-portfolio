<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
<style>
    .clase1{
        border: rebeccapurple 3px dotted;
        background-color: black;
        color: yellow;
    }
    .clase2{
        border-top: blue 6px groove;
        border-bottom: purple 6px ridge;
        border-left: red 6px solid;
        border-right: orangered 3px dashed;
        background-color: darkgreen;
        color: lightcoral;
    }
    #clase_unica{
        color: red;
        border: 6px purple groove;
    }
</style>
</head>
<body>
    <p class="clase1">Esto es un párrafo</p><br><br>
    <h3 class="clase2">Esto es un párrafo</h3><br><br>
    <b id="clase_unica">Esto es un párrafo</b><br><br>
</body>
</html>
