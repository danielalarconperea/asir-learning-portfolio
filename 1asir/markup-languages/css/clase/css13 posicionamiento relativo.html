<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POSICIONAMIENTO RELATIVO</title>
<style>
    div{
        border: 2px solid;
        width: 250px;
        height: 50px;
        margin: 4px;
        padding: 5px;
        background-color: pink;
    }
    #dos{
        position: relative;
        bottom: 50px;
        left: 50px;
    }
    #tres{
        position: relative;
        top: 50px;
        right: 50px;
    }
</style>
</head>
<body>
    <div id="un">primero</div>
    <div id="dos">segundo</div>
    <div id="tres">tercero</div>
</body>
</html>
