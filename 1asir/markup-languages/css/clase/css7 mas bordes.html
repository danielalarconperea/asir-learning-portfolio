<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
<style>
#borde-solido {
    border: 3px dotted blue;
    width: 200px;
    height: 100px;
}
#borde-doble{
    border: 8px double red;
    width: 300px;
    height: 200px;
}
#borde-sombreado{
    border: 4px solid black;
    width: 220px;
    height: 120px;
    box-shadow: 20px 25px 15px red;
}
#borde-redondeado{
    border: 3px solid purple;
    width: 200px;
    height: 100px;
    border-radius: 15px;
}
</style>
</head>
<body>
    <h1>ejemplo de Bordes en CSS</h1>
    <div id="borde-solido">borde solido</div>
    <div id="borde-doble">borde doble</div>
    <div id="borde-sombreado">borde con sombra</div>
    <div id="borde-redondeado">borde redondeado</div>
</body>
</html>
