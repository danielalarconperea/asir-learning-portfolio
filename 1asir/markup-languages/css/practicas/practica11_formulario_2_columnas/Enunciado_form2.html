<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario Moderno</title>
<style>
    body{
        background-color: rgb(144, 246, 255);
    }
    .form-container{
        background-color: white;
        margin: auto;
        width: 600px;
        height: 100%;
        padding: 20px 20px 20px 20px;
        border-radius: 10px;
        font-family: Arial, Helvetica, sans-serif;
        color: #006544;
    }
    h2{
        text-align: center;
        
    }
    .form-group{
        padding: 5px 5px 5px 5px;
    }
    .form-row{
        /* border-color: red;
        border-style: solid; */
        display: flex;
        padding-bottom: 10px;
    }
    #nombre,#email,#password,#fecha,#genero,#telefono{
        width: 250px;
        border-radius: 5px;
        border: 1px solid #006544;
        padding: 10px 0px 10px 10px;
    }
    #direccion{
        width: 150px;
        border-radius: 5px;
        border: 1px solid #006544;
        padding: 10px 0px 10px 10px;
    }
    #archivo{
        width: 400px;
        border-radius: 5px;
        border: 1px solid #006544;
        padding: 10px 0px 10px 10px;
    }
    #bio{
        width: 100%;
        border-radius: 5px;
        border: 1px solid #006544;
        padding: 10px 0px 10px 10px;
        margin: 5px 0px 0px 0px;
    }
    #aceptar,#suscripcion_si,#suscripcion_no{
        width: 100%;
        border-radius: 5px;
        border: 1px solid #006544;
        padding: 10px 0px 10px 10px;
        margin: 5px 0px 0px 0px;
    }
    button{
        background-color: #006544;
        color: white;
        width: 100%;
        padding: 10px 0px 10px 10px;
        margin: 5px 0px 0px 0px;
        border-radius: 5px;
    }
</style>
</head>
<body>
    <div class="form-container">
        <h2>Formulario de Registro</h2>
        <form>
            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="fecha">Fecha de Nacimiento:</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="genero">Género:</label>
                    <select id="genero" name="genero" required>
                        <option value="masculino">Masculino</option>
                        <option value="femenino">Femenino</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="direccion">Dirección:</label>
                    <input type="text" id="direccion" name="direccion" required>
                </div>
                <div class="form-group">
                    <label for="archivo">Subir Archivo:</label>
                    <input type="file" id="archivo" name="archivo">
                </div>
            </div>
            <div class="form-group">
                <label for="bio">Biografía:</label>
                <textarea id="bio" name="bio" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label for="aceptar">Aceptar Términos:</label>
                <input type="checkbox" id="aceptar" name="aceptar" required>
            </div>
            <div class="form-group">
                <label>Suscripción:</label>
                <input type="radio" id="suscripcion_si" name="suscripcion" value="si">
                <label for="suscripcion_si">Sí</label>
                <input type="radio" id="suscripcion_no" name="suscripcion" value="no">
                <label for="suscripcion_no">No</label>
            </div>
            <div class="form-group">
                <button type="submit">Registrarse</button>
            </div>
        </form>
    </div>
</body>
</html>
