h1{

.enero{
  width: 95%;

.enero table{

}

.febrero{

  text-align: right;
  padding: 2px 5px;
  border-right: 1px solid #e1e1e1;

}
.febrero table tbody tr td{
  font-size: 3ex;
}
.febrero table tbody tr th{
  font-size: 2.5ex;
}
.febrero table caption{
  text-align: right;
  font-weight: bold;
  font-size: 2.5ex;
}
</style>
</head>
