<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORDER</title>
<style>
    div{display: flex;}
    p{
        width: 100px; 
        border: black 1px solid; 
        margin: 2px; 
        border-radius: 15px; 
        box-shadow: 2px 2px 3px black; 
        padding: 5px;
    }
    p.primero{order: -1;}
</style>
</head>
<body>
<div>
    <p>primer parrafo</p>
    <p>segundo parrafo</p>
    <p>tercer parrafo</p>

</div>
