<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORDER</title>
<!-- La propiedad justify-content establece la forma en que se reparte el espacio libre disponible en la 
 direción principal.
    Flex-start: Los elementos se sitúan al principio de la dirrección principal, es decir, 
     el espacio disponibe se sitúa al final.
    Flex-end: Los elementos se sitúan al orincipio de la dirección principal, es decir, 
     el espacio disponible se sitúa al principio.
    Center: Los elementos se sítuan en el centro de la dirección principal, es dicir,
     el espacio disponible se reparte entre el principio y el final.
    Space-between: El espacio disponible se reparte entre los elementos.
    Space-around: El espacio disponible se reparte entre los elementos y en los extremos.
-->
<style>
    div{
        display: flex;
        justify-content: space-between;
    }
    p{
        background-color: rgba(137, 43, 226, 0.322);
        border: black 1px solid; 
        margin: 2px; 
        border-radius: 15px; 
        box-shadow: 2px 2px 3px rgba(0, 0, 0, 0.375); 
        padding: 5px;
    }
</style>
</head>
<body>
<div>
    <p>primer parrafo</p>
    <p>segundo parrafo</p>
    <p>tercer parrafo tercer parrafo tercer parrafo tercer parrafo</p>
    <p>cuarto parrafo</p>
</div>
<div>
    <p>primer parrafo</p>
    <p>segundo parrafo</p>
    <p>tercer parrafo</p>
    <p>cuarto parrafo</p>
</div>
</body>
</html>
