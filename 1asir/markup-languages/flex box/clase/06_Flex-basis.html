<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORDER</title>
<style>
    div{display: flex;}
    p{
        flex-basis: 25%; /* content, auto, tamaño */ /* Que ancho queremos por defecto por cada uno de los elementos */
        
        background-color: rgba(137, 43, 226, 0.322);
        border: black 1px solid; 
        margin: 2px; 
        border-radius: 15px; 
        box-shadow: 2px 2px 3px rgba(0, 0, 0, 0.375); 
        padding: 5px;
    }
    p.primero{order: -1;}
</style>
</head>
<body>
<div>
    <p>primer parrafo</p>
    <p>segundo parrafo</p>
    <p>tercer parrafo</p>
    <p class="primero">cuarto parrafo</p>
</div>
<div>
    <p>primer parrafo</p>
    <p>segundo parrafo</p>
    <p>tercer parrafo</p>
    <p>cuarto parrafo</p>
</div>
</body>
</html>
