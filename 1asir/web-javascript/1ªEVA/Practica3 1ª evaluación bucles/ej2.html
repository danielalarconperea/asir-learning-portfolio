<!DOCTYPE html>

<body>
<h1><center>Ejercicio2</center></h1>
<script type="text/javascript">
var num = parseInt(prompt('dime un número'));
var i = 0;
while(i < 10){
    i++;
    document.write(num+' x '+i+' = '+(i*num)+'<br>');
}
</script>
</body>
</html>
<!-- Ejercicio 2: Tabla de multiplicar
Pide al usuario un número y muestra la tabla de multiplicar de ese número del 1 al 10. -->
