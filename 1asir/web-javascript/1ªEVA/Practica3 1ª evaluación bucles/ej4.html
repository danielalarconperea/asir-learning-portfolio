<body>
<h1><center>Ejercicio4</center></h1>
<script type="text/javascript">
var num = parseInt(prompt('dime un número'));
var i = 2;
while(i <= num){
    document.write(i+'<br>');
    i = i + 2;
}
</script>
</body>
</html>
<!-- Ejercicio 4: Imprimir números pares
Pide al usuario un número y muestra todos los números pares desde 1 hasta ese número. -->
