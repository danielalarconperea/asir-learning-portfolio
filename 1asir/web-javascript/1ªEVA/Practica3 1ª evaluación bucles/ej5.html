<body>
<h1><center>Ejercicio5</center></h1>
<script type="text/javascript">
var num = parseInt(prompt('dime un número'));
var i = 1;
while(i <= num){
    document.write(num+'<br>');
    num--;
}
</script>
</body>
</html>
<!-- Ejercicio 5: Imprimir números descendentes
Pide al usuario un número y muestra todos los números desde ese número hasta 1. -->
