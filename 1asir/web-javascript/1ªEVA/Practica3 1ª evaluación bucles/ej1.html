<body>
<h1><center>Ejercicio1</center></h1>
<script type="text/javascript">
var num = parseInt(prompt('dime un número'));
var i = 1;
while(i <= num){
    document.write(i+'<br>');
    i++;
}
</script>
</body>

<!-- Ejercicio 1: Contar hasta un número
Pide al usuario un número con prompt y muestra desde 1 hasta ese número. -->
