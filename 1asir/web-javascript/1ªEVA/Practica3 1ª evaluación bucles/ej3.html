<body>
<h1><center>Ejercicio3-</center></h1>
<script type="text/javascript">
var num = parseInt(prompt('dime un número'));
var i = 0;
var sum = 0;
while(i < num){
    i++;
    sum = sum + i; //sum += i
    document.write(sum+'<br>');
}
document.write('La suma total es: ' + sum);
</script>
</body>
</html>
<!-- Ejercicio 3: Sumar números hasta un límite
Pide al usuario un número y muestra la suma de todos los números desde 1 hasta ese número. -->
