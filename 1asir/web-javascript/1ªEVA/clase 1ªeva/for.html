<!DOCTYPE html>
<html lang="es">
<head>

</head>

<body>
<p>esta página contiene código de javascript</p>

<script type="text/javascript">

var i;
for (i=0; i<=10; i++){ //inicializar; condición; incremento o decremento
    document.write(i+'<br>');
}
document.write('----------------<br>');
for (i=100; i>80; i--){ //inicializar; condición; incremento o decremento
    document.write(i+'<br>');
}
document.write('----------------<br>');
var num;
num=parseInt(prompt('Introduzca un número'))
for (i=1; i<=num; i++){
    if(i%2!=0){
        document.write(i+'<br>');
    }
}
document.write('----------------<br>');
var palabra, contador;
palabra=prompt('introduce una palabra:')
contador=0
for(i=0; i<palabra.length; i++){
    contador++;
}
document.write(palabra+' tiene '+contador+' letras.<br>')
</script>
</body>
</html>
