function Par_Impar(num1){
    if (num1 % 2 == 0){
        alert("El número "+num1+" es par");
    }else{ 
        alert("El número "+num1+" es impar");
    }
}

function mostrardia(){
    var fecha = new Date();
    document.write('Hoy es día '+fecha.getDate()+'<br>');
    document.write('El mes es '+fecha.getMonth()+'<br>');
    document.write('El año es '+parseInt(fecha.getYear()+1900)+'<br>');
    document.write('El año es '+fecha.getFullYear()+'<br>');
}
mostrardia()

</script>
