<!DOCTYPE html>

<body>
<p>esta página contiene código de javascript</p>

<script type="text/javascript">
var i, j, multi;
for(i=0; i<=10; i++){
    document.write('<h2>La tabla de multiplicar del '+i+'</h2>');
    document.write('<ul>');
    for(j=0; j<=10; j++){
        multi=i*j
        document.write('<li>'+i+' x '+j+' = '+multi);
        document.write('</li>');
    }
    document.write('</ul>');
}

</script>
</body>
</html>
