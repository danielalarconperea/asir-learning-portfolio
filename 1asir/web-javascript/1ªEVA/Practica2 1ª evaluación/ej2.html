<body><h1>EJERCICIO 2</h1>
<!--  
    2.-Crea un programa que pida al usuario su edad y su país de residencia. 
    Si el usuario tiene 18 años o más y vive en un país donde el voto es permitido (por ejemplo, "España"), 
    muestra "Eres elegible para votar". En cualquier otro caso, muestra "No eres elegible para votar".
-->
<script type="text/javascript">

var edad = prompt('dame tú edad');
var pais = prompt('dime tu pais de residancia');

if (edad >= 18 && pais == españa)
{
    document.write('Eres elegible para votar');
}
else 
{
    document.write('No eres elegible para votar');
}
    </script>
</body>
</html>
