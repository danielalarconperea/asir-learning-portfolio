<body><h1>EJERCICIO 3</h1>
<!--
    3.-Escribe un programa que pida al usuario su rol en un sitio web (puede ser "admin", "editor", o "visitante"). 
    Si el rol es "admin" o "editor", muestra "Acceso permitido". Si es cualquier otro, muestra "Acceso denegado".
-->
<script type="text/javascript">

var rol = prompt('escribe tu rol');

if (rol == 'admin' || rol == 'editor')
{
    document.write('Acceso permitido');
}
else
{
    document.write('Acceso denegado');
}

</script>
</body>
</html>
