<body><h1>EJERCICIO 1</h1>
<!--
    1.-Escribe un programa que pida al usuario su temperatura corporal.
    Si la temperatura está entre 36°C y 37.5°C inclusive, muestra el mensaje "Estás sano". 
    Si la temperatura es menor de 36°C o mayor de 37.5°C, muestra "Posible enfermedad".
-->
<script type="text/javascript">

var temp = prompt('dime tu temperatura corporal');

if(temp >= 36 && temp <= 37.5)
{
    document.write('estas sano');
}
else
{
    document.write('posible enfermedad');
}

</script>
</body>
</html>
