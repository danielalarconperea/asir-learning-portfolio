<!DOCTYPE html>
<html lang="es">
<head>
</head>
<body><p>Escribe un programa que pida al usuario dos números y muestre cuál de ellos es mayor, o si ambos son iguales.</p>
<script type="text/javascript">

var num1 = parseFloat(prompt("Ingrese un número"));
var num2 = parseFloat(prompt("Ingrese otro número"));

if (num1==num2) {
    document.write("Los dos números son iguales");
}
else if (num1<num2) {
    document.write("El segundo número es mayor");
}
else {
    document.write("El primer número es mayor");
}
</script></body></html>
