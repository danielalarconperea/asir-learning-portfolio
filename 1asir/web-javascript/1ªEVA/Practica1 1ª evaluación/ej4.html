<!DOCTYPE html>
<html lang="es">
<head>
</head>
<body><p>Crea un programa que pida al usuario su edad. Si tiene menos de 18 años, muestra "Eres menor de edad". 
Si tiene entre 18 y 65 años, muestra "Eres adulto". Si tiene más de 65 años, muestra "Eres mayor".
</p>
<script type="text/javascript">

var num1 = parseFloat(prompt("Ingrese su edad"));

if (num1<18) {
    document.write("Eres menor de edad");
}
else if (num1>65) {
    document.write("Eres mayor");
}
else {
    document.write("Eres adulto");
}

</script></body></html>
