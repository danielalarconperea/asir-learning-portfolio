<!DOCTYPE html>

<body><p>Escribe un programa que pida al usuario un número entero y muestre si es par o impar.</p>
<script type="text/javascript">
    
var num = parseInt(prompt("Dime un número entero"));

    if (num % 2 == 0)
        document.write("El número es par");
    else 
        document.write("El número es impar");

</script></body></html>
