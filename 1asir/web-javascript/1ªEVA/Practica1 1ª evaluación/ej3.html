<!DOCTYPE html>
<html lang="es">
<head>
</head>
<body><p>Escribe un programa que pida al usuario dos números. Si el primero es mayor 10, los multiplica. Si no, los suma. Muestra el resultado.</p>
<script type="text/javascript">
    
var multi,sum;
var num1 = parseFloat(prompt("Ingrese un número"));
var num2 = parseFloat(prompt("Ingrese otro número"));

if (num1>10) {
    multi = num1 * num2;
    document.write("La multiplicación es: " + multi);
}
else
    sum = num1 + num2;
    document.write("La multiplicación es: " + sum);

</script></body></html>
