<body>
<h1>Ejercicio 3</h1>
<script type="text/javascript">
var i, num;
num=parseInt(prompt('dime un número y te digo los multiplos de 3 y de 4 que hay hasta ese número'));
for(i=1; i<=num; i++){
    if(i%3==0 && i%4==0){
        document.write('El '+i+ ' es multiplo de 3 y 4 <br>');
    }
}
</script>
</body>
</html>
