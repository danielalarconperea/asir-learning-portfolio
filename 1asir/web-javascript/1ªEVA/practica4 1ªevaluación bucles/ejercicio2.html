<!DOCTYPE html>

<body>
<h1>Ejercicio 2</h1>
<script type="text/javascript">
var i, num;
num=parseInt(prompt('dime un número y te digo los números divisibles de 3 y de 5'));
for(i=1; i<=num; i++){
    if(i%3==0 || i%5==0){
        document.write('El '+i+ ' es divisible entre 3 o 5<br>');
    }
}
</script>
</body>
</html>

<!-- Ejercicio 2: Números divisibles por 3 o 5 (num%3 y num%5)
Pide al usuario un número límite (prompt) y 
muestra todos los números desde 1 hasta ese límite que sean divisibles por 3 o por 5.-->
