<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Problema3</title>
</head>
<body>
<script type="text/javascript">

var i;
var suma=0;
var n=parseInt(prompt('dime un número'));

for(i=1; i<=n; i++){//inicializar; condición; incremento o decremento
    suma += i;
}
document.write('la suma de todos los números del 1 hasta el que me has dicho da: '+suma);

</script>
</body>
</html>
