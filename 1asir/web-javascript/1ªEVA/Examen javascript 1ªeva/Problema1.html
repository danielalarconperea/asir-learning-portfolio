<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Problema1</title>
</head>
<body>
<script type="text/javascript">

var edad=parseInt(prompt('dime cuantos años tienes'));

if(edad < 13)
{
    document.write('Eres un niño');
}
else if(edad >= 13 && edad < 18)
{
    document.write('Eres un adolescente');
}
else
{
    document.write('Eres un adulto');
}

</script>
</body>
</html>
