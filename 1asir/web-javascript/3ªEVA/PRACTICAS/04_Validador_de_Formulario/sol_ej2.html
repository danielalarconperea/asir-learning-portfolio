<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operaciones Matemáticas</title>
</head>
<body>
  <h1>Calculadora Básica</h1>
  <form id="formulario">
    <label for="numero1">Número 1:</label>
    <input type="number" id="numero1" placeholder="Escribe el primer número"><br><br>

    <label for="numero2">Número 2:</label>
    <input type="number" id="numero2" placeholder="Escribe el segundo número"><br><br>

    <label for="operacion">Operación:</label>
    <select id="operacion">
      <option value="">Selecciona una operación</option>
      <option value="suma">Suma</option>
      <option value="resta">Resta</option>
      <option value="multiplicacion">Multiplicación</option>
      <option value="division">División</option>
    </select><br><br>

    <button type="button" onclick="calcularOperacion()">Calcular</button>
  </form>
  <p id="resultado"></p>

  <script>
    function calcularOperacion() {
      var numero1 = parseFloat(document.getElementById("numero1").value);
      var numero2 = parseFloat(document.getElementById("numero2").value);
      var operacion = document.getElementById("operacion").value;
      var resultado = document.getElementById("resultado");

      if (isNaN(numero1) || isNaN(numero2)) {
        resultado.textContent = "Por favor, ingresa números válidos.";
        resultado.style.color = "red";
        return;
      }

      switch (operacion) {
        case "suma":
          calculo = numero1 + numero2;
          break;
        case "resta":
          calculo = numero1 - numero2;
          break;
        case "multiplicacion":
          calculo = numero1 * numero2;
          break;
        case "division":
          if (numero2 == 0) {
            alert(operacion)
            resultado.textContent = "No se puede dividir entre cero.";
            resultado.style.color = "red";
            return;
          }
          calculo = numero1 / numero2;
          break;
        default:
          resultado.textContent = "Selecciona una operación válida.";
          resultado.style.color = "orange";
          return;
      }

      resultado.textContent = "El resultado es: " + calculo;
      resultado.style.color = "green";
    }
  </script>
</body>
</html>
