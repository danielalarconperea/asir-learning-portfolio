<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Verificación de Color Favorito</title>
<script type="text/javascript">
    function color_favorito(){
        var indice = document.formulario.seleccion.selectedIndex;
        var color = document.formulario.seleccion.options[indice].value;
        if (color == 'Azul'){
            alert('El usuario a seleccionado el color azul');
        }else{
            alert('El usuario no a seleccionado el color azul');
        }

    }
</script>
</head>
<body>
    <h2>Verificación de Color Favorito</h2>
    <form name="formulario">
        <label >Selecciona tu color favorito:</label>
        <select name="seleccion">
            <option value="Rojo">Rojo</option>
            <option value="Verde">Verde</option>
            <option value="Azul">Azul</option>
            <option value="Amarillo">Amarillo</option>
        </select>
        <button type="button" onclick="color_favorito()">Verificar</button>
    </form>
</body>
