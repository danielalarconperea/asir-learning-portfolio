<!DOCTYPE html>

<body>
<script type="text/javascript">

function mayor (x, y){
    if (x>=y){
        return x;
    }else{
        return y;
    }
}
var valor_x=parseInt(prompt('introduzca un número'))
var valor_y=parseInt(prompt('introduzca otro número'))
document.write('El número más grande es el '+ mayor(valor_x,valor_y))

</script>
</body>
