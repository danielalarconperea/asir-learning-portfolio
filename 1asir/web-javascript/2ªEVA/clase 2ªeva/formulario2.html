<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<script lenguaje="javascript">
function calcular_area(){
    var base = parseFloat(document.triangleform.base.value); //DOM
    var altura = parseFloat(document.triangleform.altura.value);
    var area = (base * altura)/2;
    document.write('El área del triángulo es: '+area)
}
</script>
</head>
<body>
<form name="triangleform">
    <label for="base">Base:</label>
    <input type="number" name="base"><br><br>
    <label for="altura">Altura:</label>
    <input type="number" name="altura"><br><br>
    <!-- <input type="button" value="Calcular Área" onclick="calcular_area()"> -->
    <button type="button" onclick="calcular_area()">Calcular Área</button>
</form>
</body>
</html>
