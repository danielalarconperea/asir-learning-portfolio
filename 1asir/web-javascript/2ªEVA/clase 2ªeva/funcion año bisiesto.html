<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>divisible por 4 y no por 100</title>
</head>
<body>
<script type="text/javascript">
function año_bisiesto (año){
    if (año%4==0 && año%100!=0){
        return true;
    }else{
        return false;
    }
}
var año_introducido=parseInt(prompt('Introduce un año'))
document.write('El año introducido es bisiesto: '+año_bisiesto(año_introducido))
</script>
</body>
</html>
