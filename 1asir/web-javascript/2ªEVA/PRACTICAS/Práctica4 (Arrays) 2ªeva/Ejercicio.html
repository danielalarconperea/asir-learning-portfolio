<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio</title>
</head>
<body bgcolor="black"><font color="white">
<script type="text/javascript">
function ingresar_elementos(elemento){
    var contador65=0, contador18=0;
    for(i=0; i<elemento.length;i++){
        var el=parseInt(prompt('Ingresa un elemento'));
        elemento[i] = el;
    }
    for(i=0; i<elemento.length;i++){
        document.write((i+1)+'º elemento: '+elemento[i]+'<br>');
    }
    for(i=0; i<elemento.length;i++){
        if(elemento[i]>65){
            contador65++;
        }else if(elemento[i]<18){
            contador18++;
        }
    }
    document.write('<br>Hay '+contador65+' elementos mayores de 65<br>Hay '+contador18+' menores de edad');
}
var elemento = new Array(8);
ingresar_elementos(elemento);
</script>
</font>
</body>
</html>
<!-- 
Vector de edades de personas.
Desarrollar un programa que permita ingresar un vector de 8 elementos, e informe:
- Cargar los 8 elementos
- Mostrar todos los elementos del vector.
- Cuantos de los elementos son mayores a 65.
- Cuantos son menores de edad
