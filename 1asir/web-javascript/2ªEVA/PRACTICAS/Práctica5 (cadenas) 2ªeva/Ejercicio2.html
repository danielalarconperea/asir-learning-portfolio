<script type="text/javascript">
    
function cadena_titulo (cadena){
    var j=1, resultado='';
    for(i = 0; i < cadena.length; i++){
        if(cadena.charAt(i) != ' ' && j==1){
            resultado += cadena.charAt(i).toUpperCase();
            j=0;
        }else{
            resultado += cadena.charAt(i);
            if (cadena.charAt(i) == ' ') {
                j=1;
            }
        }
    }
    document.write(resultado);
}
cadena_titulo('hola buenas tardes juan alberto');

</script>
