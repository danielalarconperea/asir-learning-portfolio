<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio2</title>
</head>
<body>
<script type="text/javascript">

function tabla_multiplicar(){
    var num = parseInt(prompt('dime un número y te dire la tabla de multiplicar'));;
    for(i=1; i<=10; i++){
    resultado = num*i;
    document.write(num+' x '+i+' = '+ resultado+'<br>');
    }
}
tabla_multiplicar();

</script>
</body>
</html>
<!-- 
Generar una tabla de multiplicar
Crea una función que reciba un número y 
devuelva un string con la tabla de multiplicar de ese número del 1 al 10. 
Usa un bucle para generar cada línea de la tabla.
-->
