<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ejercicio 2</title>
<style>
  body{
    background-color: #151515;
    color: white;
  }
</style>

</style>
</head>
<body>
<script type="text/javascript">
function tabla(){
    var numero = document.Tabla_multiplicar.numero.value;
    document.write('<table border="1" style="margin: 0 auto; border-collapse: collapse; width: 50%; background-color: black; color: white;">');
    document.write('<tr>');
    document.write('<th style="border: 1px solid grey; padding: 8px; text-align: center; background-color: #151515;">Multiplicar</th>')
    document.write('<th style="border: 1px solid grey; padding: 8px; text-align: center; background-color: #151515;">Resultado</th>')
    document.write('</tr>');
    for(i=0; i<=10; i++){
        document.write('<tr>');
        document.write('<td style="border: 1px solid grey; padding: 8px; text-align: center;">'+numero+'x'+i+'</td>');
        document.write('<td style="border: 1px solid grey; padding: 8px; text-align: center;">'+numero*i+'</td>');
        document.write('</tr>');
    }
    document.write('</table>');
}
</script>
<form name="Tabla_multiplicar">
    <label for="numero">Número:</label>
    <input type="number" name="numero"><br><br>
    <button type="button" onclick="tabla()">Crear Tabla de Multiplicar</button>
</form>
</body>
<!-- Tabla de Multiplicar:
Crea un formulario donde el usuario ingrese un número. 
Al enviar el formulario, se generará una tabla HTML que muestre la tabla de multiplicar del número ingresado.> -->
</html>
