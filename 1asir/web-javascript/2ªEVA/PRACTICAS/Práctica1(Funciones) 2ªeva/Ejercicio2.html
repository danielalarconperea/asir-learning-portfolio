<script type="text/javascript">

function Celsius_to_Fahrenheit(Celsius){
    Fahrenheit = (Celsius * 9/5) + 32;
    return Fahrenheit;
}
var Celsius=parseInt(prompt('introduzca la temperatura en Celsius: '));
alert('La temperatura combertida a Fahrenheit es: '+Celsius_to_Fahrenheit(Celsius));

</script>
