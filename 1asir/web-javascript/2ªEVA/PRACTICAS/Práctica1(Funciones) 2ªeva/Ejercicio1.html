<body>
<script type="text/javascript">

function Area_rectangulo(ancho, alto){
    var area = ancho*alto;
    return area;
}
var ancho=parseInt(prompt('dime el ancho del rectángulo')), alto=parseInt(prompt('dime el alto del rectángulo'));
resultado = Area_rectangulo(ancho, alto);
alert('El área del rectángulo es: '+resultado);

</script>
