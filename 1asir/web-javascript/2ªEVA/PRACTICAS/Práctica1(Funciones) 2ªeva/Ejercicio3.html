<!DOCTYPE html>
<html lang="es">

    <title>Ejercicio3</title>

<body>
<script type="text/javascript">

function Par_Impar(num){
    if (num % 2 == 0){
        alert("El número "+num+" es par");
    }else if (num % 2 == 1){
        alert("El número "+num+" es impar");
    }else{ 
        alert("Introduzca un parametro valido");
    }
}
var num = parseInt(prompt('Introduzca un número y te dire si es par o impar: '));
Par_Impar(num);

</script>
</body>
</html>
