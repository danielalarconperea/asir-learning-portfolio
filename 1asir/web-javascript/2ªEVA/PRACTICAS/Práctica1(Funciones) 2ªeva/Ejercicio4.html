<body>
<script type="text/javascript">

function IVA(precio_base, porcentaje_IVA){
    var Precio_final = precio_base * porcentaje_IVA * 0.01 + precio_base;
    return Precio_final;
}
var precio_base = parseFloat(prompt('Dime el precio base del producto: ')), porcentaje_IVA = parseFloat(prompt('Dime el porcentaje de IVA (_%): '));
alert('El precio final del producto es: '+IVA(precio_base, porcentaje_IVA));

</script>
</body>
</html>
