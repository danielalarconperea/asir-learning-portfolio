<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="widtr=device-widtr, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: rgb(95, 95, 95);
            color: rgb(255, 255, 255);
            font-size: xxx-large;
        }

        .calculator {
            width: 300px;
            background-color: #212121;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .display {
            background-color: #2c2c2c;
            color: white;
            text-align: right;
            padding: 20px;
            font-size: 2rem;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background-color: #333;
        }

        .button {
            background-color: #3c3c3c;
            color: white;
            border: none;
            padding: 20px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .button:hover {
            background-color: #4c4c4c;
        }

        .operator {
            background-color: #f39c12;
        }

        .operator:hover {
            background-color: #d35400;
        }

        .equals {
            background-color: #e74c3c;
            grid-column: span 1;
        }

        .equals:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>
    <form class="calculator" name="calculadora">
        <input type="text" class="display" name="contenido" value="0" readonly>
        <div class="buttons">            
            <button class="button" onclick="percent()">%</button>
            <button class="button" onclick="clearDisplay()">CE</button>
            <button class="button" onclick="clearDisplay()">C</button>
            <button class="button" onclick="deleteLastDigit()">⌫</button>
            
            <button class="button" onclick="reciprocal()">¹/x</button>
            <button class="button" onclick="square()">x²</button>
            <button class="button" onclick="sqrt()">√x</button>
            <button class="button operator" onclick="appendToDisplay('/')">÷</button>
            
            <button class="button" onclick="appendToDisplay('7')">7</button>
            <button class="button" onclick="appendToDisplay('8')">8</button>
            <button class="button" onclick="appendToDisplay('9')">9</button>
            <button class="button operator" onclick="appendToDisplay('*')">×</button>
            
            <button class="button" onclick="appendToDisplay('4')">4</button>
            <button class="button" onclick="appendToDisplay('5')">5</button>
            <button class="button" onclick="appendToDisplay('6')">6</button>
            <button class="button operator" onclick="appendToDisplay('-')">-</button>
            
            <button class="button" onclick="appendToDisplay('1')">1</button>
            <button class="button" onclick="appendToDisplay('2')">2</button>
            <button class="button" onclick="appendToDisplay('3')">3</button>
            <button class="button operator" onclick="appendToDisplay('+')">+</button>
            
            <button class="button" onclick="toggleSign()">±</button>
            <button class="button" onclick="appendToDisplay('0')">0</button>
            <button class="button" onclick="appendDecimal()">.</button>
            <button class="button equals" onclick="calculate()">=</button>
        </div>
    </form>

    <script>
        var calculadora = document.calculadora;
        var display = document.calculadora.contenido;
        var currentExpression = '';

        function appendToDisplay(value) {
            if (display.textContent === '0' || display.textContent === 'Error') {
                display.textContent = value;
            } else {
                display.textContent += value;
            }
            currentExpression = display.textContent;
        }

        function appendDecimal() {
            var parts = currentExpression.split(/[\+\-\*\/]/);
            var currentNumber = parts[parts.length - 1];
            
            if (!currentNumber.includes('.')) {
                appendToDisplay('.');
            }
        }

        function clearDisplay() {
            display.textContent = '0';
            currentExpression = '';
        }

        function deleteLastDigit() {
            if (display.textContent.length > 1) {
                display.textContent = display.textContent.slice(0, -1);
            } else {
                display.textContent = '0';
            }
            currentExpression = display.textContent;
        }

        function toggleSign() {
            var parts = currentExpression.split(/([\+\-\*\/])/g);
            var lastPart = parts.pop() || '';
            
            if (lastPart.startsWith('-')) {
                lastPart = lastPart.slice(1);
            } else if (lastPart !== '') {
                lastPart = '-' + lastPart;
            }
            
            parts.push(lastPart);
            display.textContent = parts.join('');
            currentExpression = display.textContent;
        }

        function calculate() {
            try {
                var result = eval(currentExpression.replace(/x/g, '*'));
                display.textContent = result.toString();
                currentExpression = display.textContent;
            } catch (error) {
                display.textContent = 'Error';
                currentExpression = '';
            }
        }

        function percent() {
            try {
                var value = parseFloat(display.textContent);
                display.textContent = (value / 100).toString();
                currentExpression = display.textContent;
            } catch (error) {
                display.textContent = 'Error';
                currentExpression = '';
            }
        }

        function reciprocal() {
            try {
                var value = parseFloat(display.textContent);
                if (value === 0) throw Error;
                display.textContent = (1 / value).toFixed(6);
                currentExpression = display.textContent;
            } catch (error) {
                display.textContent = 'Error';
                currentExpression = '';
            }
        }

        function square() {
            try {
                var value = parseFloat(display.textContent);
                display.textContent = (value * value).toString();
                currentExpression = display.textContent;
            } catch (error) {
                display.textContent = 'Error';
                currentExpression = '';
            }
        }

        function sqrt() {
            try {
                var value = parseFloat(display.textContent);
                if (value < 0) throw Error;
                display.textContent = Math.sqrt(value).toString();
                currentExpression = display.textContent;
            } catch (error) {
                display.textContent = 'Error';
                currentExpression = '';
            }
        }
    </script>
</body>
</html>
