<body>
<script type="text/javascript">

var texto = prompt('dime una cadena de caracteres para invertirla'), textoinvertido='';

for(i = 0; i< texto.length; i++){
    textoinvertido += texto[texto.length-i-1];
}
document.write(textoinvertido)

</script>
<!-- Invertir una cadena:
Escribe un programa que inviera el orden de los caracteres de una cadena. -->
